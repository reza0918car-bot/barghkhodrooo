<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923"><title>برق خودرو مهندس</title><style>
:root{--bg:#0d151e;--panel:#172431;--panel2:#1e3040;--text:#f2f6fa;--muted:#9fb0bf;--orange:#ff8a24;--green:#25c58a;--line:#2b4051;--red:#ff6262}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#0b141d,#111f2b 60%,#182633);color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#ffad42,#f36c18);display:grid;place-items:center;font-size:26px;box-shadow:0 8px 24px #ff8a2433}.brand h1{font-size:18px;margin:0 0 5px}.brand small{color:var(--muted)}.pill{border:1px solid #2e765e;color:#71e4b7;background:#15382f;padding:7px 11px;border-radius:30px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:#172431eF;border:1px solid var(--line);border-radius:16px;padding:14px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:8px}.stat em{font-style:normal;color:var(--orange);font-size:11px}.layout{display:grid;grid-template-columns:210px 1fr;gap:14px}.nav{background:#172431;border:1px solid var(--line);border-radius:16px;padding:9px;height:max-content;position:sticky;top:10px}.nav button{width:100%;text-align:right;border:0;color:#b9c7d2;background:transparent;padding:12px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#293b4a;color:white}.nav button.active{border-right:3px solid var(--orange)}.content{min-width:0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--orange);color:#1b2025;font-weight:bold}.btn.secondary{background:#293d4d;color:#e8f0f6;border:1px solid #3b5366}.btn.green{background:var(--green);color:#06271c}.btn.red{background:#562b32;color:#ffc4c4}.search{width:100%;background:#101c27;border:1px solid var(--line);color:white;border-radius:10px;padding:11px;margin:0 0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#15232f}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:12px 10px;border-bottom:1px solid #2a3b49;text-align:right}th{color:#9fb2c1;font-size:12px;background:#1a2b39}td{font-size:13px}.empty{text-align:center;color:var(--muted);padding:30px}.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#293d4d;color:#d9e7f1}.badge.good{background:#174a3c;color:#80e9be}.badge.warn{background:#57421d;color:#ffdb88}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#1b2c3a;color:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 10px;text-align:center}.quick b{display:block;font-size:23px;margin-bottom:8px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:15px;z-index:9}.modal.show{display:flex}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:#172633;border:1px solid #3a5061;border-radius:18px;padding:18px}.dialog h3{margin:0 0 15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:#aebdca;font-size:12px}.field input,.field select,.field textarea{width:100%;background:#0e1a24;color:#fff;border:1px solid #344958;border-radius:9px;padding:11px;outline:none}.field textarea{min-height:75px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.hint{color:var(--muted);font-size:11px;line-height:1.8;margin-top:12px}.hide{display:none!important}.invoice{background:#fff;color:#111;padding:22px;border-radius:8px}.invoice h2{text-align:center}.invoice table{color:#111;min-width:0}.invoice th{background:#eee;color:#111}.invoice td,.invoice th{border:1px solid #ccc}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#234b3d;color:#d9ffed;padding:12px 18px;border-radius:12px;display:none;z-index:20}.footer{text-align:center;color:#6f8494;font-size:10px;padding:20px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;padding:10px}.nav button.active{border-right:0;border-bottom:3px solid var(--orange)}.quick{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sectionhead{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr 1fr}}
@media print{body{background:white;color:#111}.app,.modal,.toast{display:none!important}#printArea{display:block!important}.invoice{border:0}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">⚡</div><div><h1>برق خودرو مهندس</h1><small>مدیریت هوشمند تعمیرگاه خودرو</small></div></div><span class="pill">● آفلاین و محلی</span></header><div class="stats"><div class="stat"><span>کل مشتریان</span><strong id="sCustomers">۰</strong><em>دفتر مشتریان</em></div><div class="stat"><span>پرونده‌های تعمیر</span><strong id="sJobs">۰</strong><em>همه وضعیت‌ها</em></div><div class="stat"><span>نوبت‌های امروز</span><strong id="sAppointments">۰</strong><em>برنامه کاری</em></div><div class="stat"><span>موجودی قطعات</span><strong id="sParts">۰</strong><em>قلم کالا</em></div></div><div class="layout"><aside class="nav" id="nav"><button class="active" data-page="home">⌂　داشبورد</button><button data-page="customers">♙　مشتریان و خودروها</button><button data-page="jobs">🔧　پرونده تعمیرات</button><button data-page="appointments">▦　نوبت‌دهی</button><button data-page="parts">▤　قطعات و انبار</button><button data-page="invoices">▧　فاکتورها</button><button data-page="reports">▥　گزارش‌ها</button><button data-page="settings">⚙　پشتیبان‌گیری</button></aside><main class="content" id="content"></main></div><div class="footer">برق خودرو مهندس · نسخه ۱.۲ · آفلاین · اطلاعات فقط روی همین دستگاه ذخیره می‌شود</div></div><div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle">ثبت اطلاعات</h3><form id="form" class="form"></form><div class="modalfoot"><button class="btn secondary" onclick="closeModal()" type="button">انصراف</button><button class="btn" id="saveBtn" type="button">ذخیره</button></div></div></div><div class="toast" id="toast"></div><div id="printArea" class="hide"></div><script>
const DBKEY='bargh_mohandes_v1';const EMPTY_DB={customers:[],cars:[],jobs:[],appointments:[],parts:[],invoices:[]};let db=JSON.parse(localStorage.getItem(DBKEY)||JSON.stringify(EMPTY_DB));let page='home',editing=null,formType='',invoiceParts=[];const fa=n=>new Intl.NumberFormat('fa-IR').format(num(n));const digits=n=>String(n??'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));const num=n=>Number(digits(n).replace(/[^0-9.-]/g,''))||0;const money=n=>new Intl.NumberFormat('fa-IR').format(num(n))+' تومان';function formatMoneyInput(el){let v=digits(el.value).replace(/[^0-9]/g,'');el.value=v?new Intl.NumberFormat('fa-IR').format(Number(v)):'';}function normalizeDb(){db={...EMPTY_DB,...(db||{})};Object.keys(EMPTY_DB).forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.customers.forEach((x,i)=>{if(!x.id)x.id=id();if(!x.createdAt)x.createdAt=i});db.cars.forEach(x=>{if(!x.id)x.id=id()});db.jobs.forEach(x=>{if(!x.id)x.id=id()});db.appointments.forEach(x=>{if(!x.id)x.id=id()});db.parts.forEach(x=>{if(!x.id)x.id=id();x.qty=num(x.qty);x.buy=num(x.buy);x.sell=num(x.sell)});db.invoices.forEach(x=>{if(!x.id)x.id=id();x.total=num(x.total);x.labor=num(x.labor);x.partsCost=num(x.partsCost);x.discount=num(x.discount);if(!Array.isArray(x.parts))x.parts=[]});localStorage.setItem(DBKEY,JSON.stringify(db));}const today=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/-/g,'/');const save=()=>{localStorage.setItem(DBKEY,JSON.stringify(db));stats()};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);normalizeDb();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)}function stats(){sCustomers.textContent=fa(db.customers.length);sJobs.textContent=fa(db.jobs.length);sAppointments.textContent=fa(db.appointments.filter(x=>x.date===today()).length);sParts.textContent=fa(db.parts.length)}function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}nav.addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function render(){stats();let c=document.getElementById('content');if(page==='home'){c.innerHTML=`<div class="sectionhead"><h2>داشبورد تعمیرگاه</h2><span class="badge good">آماده به کار</span></div><div class="quick"><button onclick="openForm('customer')"><b>♙</b>ثبت مشتری جدید</button><button onclick="openForm('job')"><b>🔧</b>پذیرش خودرو</button><button onclick="openForm('appointment')"><b>▦</b>ثبت نوبت</button><button onclick="openForm('part')"><b>▤</b>ثبت قطعه</button><button onclick="go('invoices')"><b>▧</b>صدور فاکتور</button><button onclick="go('reports')"><b>▥</b>گزارش عملکرد</button></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>آخرین پرونده‌های تعمیر</h3>${db.jobs.slice(-5).reverse().map(j=>`<p>🚘 ${esc(carLabel(j.carId))} <span class="badge">${esc(j.status)}</span></p>`).join('')||'<p class="hint">هنوز پرونده‌ای ثبت نشده است.</p>'}</div><div class="card"><h3>نوبت‌های پیش رو</h3>${db.appointments.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(a=>`<p>📅 ${esc(a.date)} — ${esc(customerName(a.customerId))}</p>`).join('')||'<p class="hint">نوبتی ثبت نشده است.</p>'}</div></div>`}
if(page==='customers')tablePage('مشتریان و خودروها','customer',[['name','نام مشتری'],['phone','موبایل'],['plate','پلاک'],['vehicle','خودرو'],['year','مدل سال']],db.customers.map(x=>({...x,plate:(db.cars.find(a=>a.customerId===x.id)||{}).plate||'',vehicle:(db.cars.find(a=>a.customerId===x.id)||{}).model||'',year:(db.cars.find(a=>a.customerId===x.id)||{}).year||''})),x=>`<button class="btn secondary" onclick="addCar('${x.id}')">+ خودرو</button> <button class="btn secondary" onclick="edit('customer','${x.id}')">ویرایش</button> <button class="btn red" onclick="del('customers','${x.id}')">حذف</button>`);
if(page==='jobs')tablePage('پرونده‌های تعمیر','job',[['customer','مشتری'],['car','خودرو / پلاک'],['km','کیلومتر'],['problem','شرح عیب'],['status','وضعیت']],db.jobs.map(x=>({...x,customer:customerName(x.customerId),car:carLabel(x.carId)})),x=>`<button class="btn secondary" onclick="edit('job','${x.id}')">ویرایش</button> <button class="btn secondary" onclick="invoiceFrom('${x.id}')">فاکتور</button> <button class="btn red" onclick="del('jobs','${x.id}')">حذف</button>`);
if(page==='appointments')tablePage('نوبت‌دهی','appointment',[['date','تاریخ'],['time','ساعت'],['customer','مشتری'],['phone','موبایل'],['note','موضوع']],db.appointments.map(x=>({...x,customer:customerName(x.customerId),phone:phoneOf(x.customerId)})),x=>`<button class="btn secondary" onclick="sms('${x.customerId}','یادآوری نوبت شما در تعمیرگاه برق خودرو مهندس برای تاریخ ${x.date} ساعت ${x.time}')">پیامک</button> <button class="btn red" onclick="del('appointments','${x.id}')">حذف</button>`);
if(page==='parts')tablePage('قطعات و انبار','part',[['name','نام قطعه'],['code','کد'],['qty','موجودی'],['buy','قیمت خرید'],['sell','قیمت فروش']],db.parts,x=>`<button class="btn secondary" onclick="edit('part','${x.id}')">ویرایش</button> <button class="btn red" onclick="del('parts','${x.id}')">حذف</button>`);
if(page==='invoices')tablePage('فاکتورها','invoice',[['number','شماره'],['customer','مشتری'],['date','تاریخ'],['total','مبلغ کل']],db.invoices.map(x=>({...x,customer:customerName(x.customerId)})),x=>`<button class="btn secondary" onclick="printInvoice('${x.id}')">چاپ / PDF</button> <button class="btn red" onclick="del('invoices','${x.id}')">حذف</button>`);
if(page==='reports')c.innerHTML=`<div class="sectionhead"><h2>گزارش‌های تعمیرگاه</h2><button class="btn secondary" onclick="exportCSV()">خروجی CSV</button></div><div class="grid2"><div class="card"><span class="hint">جمع فاکتورهای ثبت‌شده</span><h2>${money(db.invoices.reduce((s,x)=>s+(+x.total||0),0))}</h2></div><div class="card"><span class="hint">پرونده‌های تکمیل‌شده</span><h2>${fa(db.jobs.filter(x=>x.status==='تحویل داده شد').length)}</h2></div><div class="card"><span class="hint">تعداد مشتریان</span><h2>${fa(db.customers.length)}</h2></div><div class="card"><span class="hint">تعداد خودروهای ثبت‌شده</span><h2>${fa(db.cars.length)}</h2></div></div><p class="hint">گزارش مالی بر اساس فاکتورهای ثبت‌شده محاسبه می‌شود. مبالغ به تومان هستند.</p>`;
if(page==='settings')c.innerHTML=`<div class="sectionhead"><h2>پشتیبان‌گیری و تنظیمات</h2></div><div class="card"><h3>امنیت اطلاعات</h3><p class="hint">اطلاعات در حافظه همین گوشی نگهداری می‌شود. برای جلوگیری از ازدست‌رفتن اطلاعات، مرتب نسخه پشتیبان بگیر.</p><div class="actions"><button class="btn green" onclick="backup()">دریافت فایل پشتیبان</button><label class="btn secondary">بازیابی اطلاعات<input type="file" accept=".json,application/json" class="hide" onchange="restore(event)"></label></div><hr style="border-color:var(--line);margin:20px 0"><h3>یادداشت امکانات دستگاه</h3><p class="hint">پس از پذیرش خودرو و هنگام تغییر وضعیت به «آماده تحویل»، متن پیامک از طریق برنامه پیامک گوشی آماده می‌شود؛ برای ارسال نهایی باید دکمه ارسال را در گوشی بزنید و ممکن است هزینه اپراتور داشته باشد. شناسایی خودکار تماس‌گیرنده (Caller ID) به مجوزها و نقش برنامه تماس‌گیرنده پیش‌فرض اندروید نیاز دارد و در این نسخه فعال نیست.</p><button class="btn red" onclick="if(confirm('تمام اطلاعات این برنامه حذف شود؟')){localStorage.removeItem('${DBKEY}');location.reload()}">پاک‌کردن همه اطلاعات</button></div>`}
function tablePage(title,type,cols,rows,ops){document.getElementById('content').innerHTML=`<div class="sectionhead"><h2>${title}</h2><div class="actions"><button class="btn" onclick="openForm('${type}')">+ ثبت جدید</button></div></div><input class="search" placeholder="جست‌وجو در اطلاعات..." oninput="filterRows(this)"><div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>عملیات</th></tr></thead><tbody>${rows.map(x=>`<tr data-search="${esc(cols.map(a=>x[a[0]]).join(' ')).toLowerCase()}">${cols.map(a=>`<td>${['buy','sell','labor','partsCost','discount','total'].includes(a[0])&&x[a[0]]!==''&&x[a[0]]!=null?esc(money(x[a[0]])):esc(x[a[0]]||'—')}</td>`).join('')}<td>${ops(x)}</td></tr>`).join('')||`<tr><td class="empty" colspan="${cols.length+1}">اطلاعاتی ثبت نشده است.</td></tr>`}</tbody></table></div>`}function filterRows(i){let q=i.value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.dataset.search?.includes(q)?'':'none')}
function customerName(cid){return db.customers.find(x=>x.id===cid)?.name||'—'}function phoneOf(cid){return db.customers.find(x=>x.id===cid)?.phone||''}function carLabel(cid){let x=db.cars.find(a=>a.id===cid);return x?`${x.model} / ${x.plate}`:'—'}function customerCars(cid){return db.cars.filter(x=>x.customerId===cid)}function opts(arr,placeholder){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${x.id}">${esc(x.name||x.model+' - '+x.plate)}</option>`).join('')}function partName(pid){return db.parts.find(x=>x.id===pid)?.name||'—'}
function fields(type,x={}){let f=[];const add=(k,l,t='text',extra='')=>f.push(`<div class="field"><label>${l}</label><input name="${k}" type="${t}" value="${esc(x[k]||'')}" ${extra}></div>`);const area=(k,l)=>f.push(`<div class="field full"><label>${l}</label><textarea name="${k}">${esc(x[k]||'')}</textarea></div>`);const select=(k,l,arr)=>f.push(`<div class="field"><label>${l}</label><select name="${k}">${arr.map(v=>`<option ${x[k]===v?'selected':''}>${v}</option>`).join('')}</select></div>`);const customerSelect=()=>f.push(`<div class="field"><label>مشتری</label><select name="customerId" id="customerSelect" required>${opts(db.customers,'انتخاب مشتری')}</select></div>`);const carSelect=()=>f.push(`<div class="field"><label>خودرو / پلاک</label><select name="carId" id="carSelect" required>${opts(db.cars.map(a=>({...a,name:a.model+' - '+a.plate})), 'انتخاب خودرو / پلاک')}</select></div>`);
if(type==='customer'){add('name','نام و نام خانوادگی','text','required');add('phone','شماره موبایل','tel','required');add('address','آدرس');area('note','توضیحات')}
if(type==='car'){customerSelect();add('model','مدل خودرو','text','required');add('year','سال ساخت','number');add('plate','شماره پلاک');add('vin','شماره شاسی');add('engine','شماره موتور')}
if(type==='job'){customerSelect();carSelect();add('km','کیلومتر','number');select('status','وضعیت',['پذیرش شده','در حال عیب‌یابی','منتظر قطعه','در حال تعمیر','آماده تحویل','تحویل داده شد']);area('problem','شرح عیب / درخواست مشتری');area('work','اقدامات انجام‌شده');add('labor','اجرت تعمیر (تومان)','text','inputmode="numeric"');add('partsCost','هزینه قطعات (تومان)','text','inputmode="numeric"');add('photo','تصویر (انتخاب فایل)','file','accept="image/*" capture="environment"')}
if(type==='appointment'){customerSelect();add('date','تاریخ شمسی (مثلاً ۱۴۰۵/۰۸/۱۷)','text','placeholder="۱۴۰۵/۰۸/۱۷"');add('time','ساعت','time');area('note','موضوع نوبت')}
if(type==='part'){add('name','نام قطعه','text','required');add('code','کد قطعه');add('qty','موجودی','number');add('buy','قیمت خرید (تومان)','text','inputmode="numeric"');add('sell','قیمت فروش (تومان)','text','inputmode="numeric"')}
if(type==='invoice'){customerSelect();carSelect();add('number','شماره فاکتور');add('date','تاریخ');area('items','شرح خدمات');f.push(`<div class="field full"><label>قطعات مصرفی</label><div id="invoicePartsBox"></div><input type="hidden" name="partsJson" id="partsJson"><small class="hint">قطعات را از موجودی انتخاب کنید؛ موجودی هنگام ذخیره فاکتور کسر می‌شود.</small></div>`);add('labor','اجرت (تومان)','text','inputmode="numeric"');add('partsCost','هزینه قطعات (تومان)','text','inputmode="numeric"');add('discount','تخفیف (تومان)','text','inputmode="numeric"')}
return f.join('')}
function openForm(type,x=null){formType=type;editing=x?.id||null;invoiceParts=Array.isArray(x?.parts)?JSON.parse(JSON.stringify(x.parts)):[];let title={customer:'ثبت مشتری',car:'ثبت خودرو',job:'پذیرش / ویرایش تعمیر',appointment:'ثبت نوبت',part:'ثبت قطعه',invoice:'صدور فاکتور'}[type];modalTitle.textContent=title;form.innerHTML=fields(type,x||{});if(x){Object.entries(x).forEach(([k,v])=>{let el=form.elements[k];if(el&&el.type!=='file'&&k!=='id'&&k!=='parts')el.value=v})}form.querySelectorAll('input[inputmode="numeric"]').forEach(el=>{if(el.value)formatMoneyInput(el);el.addEventListener('input',()=>formatMoneyInput(el))});if(type==='invoice'){if(!x){form.elements.number.value='F-'+(db.invoices.length+1).toString().padStart(4,'0');form.elements.date.value=today()}setTimeout(()=>{setupInvoiceLinks();renderInvoiceParts()},0)}if(type==='job')setTimeout(()=>setupJobLinks(),0);if(type==='car')setTimeout(()=>setupCarCustomerLink(),0);modal.classList.add('show');saveBtn.onclick=submitForm}
function setupCarCustomerLink(){const sel=form.elements.customerId;if(sel&&editing){const c=db.cars.find(x=>x.id===editing);sel.value=c?.customerId||''}}
function setupJobLinks(){const cs=form.elements.customerId,car=form.elements.carId;if(!cs||!car)return;const selectedCar=editing?db.jobs.find(x=>x.id===editing)?.carId:'';const refresh=()=>{const cid=cs.value;const cars=cid?customerCars(cid):db.cars;car.innerHTML=opts(cars.map(a=>({...a,name:a.model+' - '+a.plate})),cid?'خودرو / پلاک مشتری':'انتخاب خودرو / پلاک');if(selectedCar&&cars.some(x=>x.id===selectedCar)){car.value=selectedCar}else if(cars.length===1){car.value=cars[0].id}};cs.addEventListener('change',refresh);car.addEventListener('change',()=>{const c=db.cars.find(x=>x.id===car.value);if(c&&cs.value!==c.customerId)cs.value=c.customerId});refresh()}
function setupInvoiceLinks(){const cs=form.elements.customerId,car=form.elements.carId;if(!cs||!car)return;const oldCar=editing?db.invoices.find(x=>x.id===editing)?.carId:'';const refresh=()=>{const cars=cs.value?customerCars(cs.value):db.cars;car.innerHTML=opts(cars.map(a=>({...a,name:a.model+' - '+a.plate})),cs.value?'خودرو / پلاک مشتری':'انتخاب خودرو / پلاک');if(oldCar&&cars.some(x=>x.id===oldCar))car.value=oldCar};cs.addEventListener('change',refresh);car.addEventListener('change',()=>{const c=db.cars.find(x=>x.id===car.value);if(c)cs.value=c.customerId});refresh()}
function renderInvoiceParts(){const box=document.getElementById('invoicePartsBox');if(!box)return;box.innerHTML=`<div class="actions" style="margin-bottom:8px"><select id="invoicePartSelect" style="flex:1;background:#0e1a24;color:#fff;border:1px solid #344958;border-radius:9px;padding:10px"><option value="">انتخاب قطعه از انبار</option>${db.parts.map(p=>`<option value="${p.id}">${esc(p.name)} — موجودی ${fa(p.qty)}</option>`).join('')}</select><input id="invoicePartQty" type="number" min="1" value="1" style="width:90px;background:#0e1a24;color:#fff;border:1px solid #344958;border-radius:9px;padding:10px"><button type="button" class="btn secondary" onclick="addInvoicePart()">افزودن</button></div><div id="invoicePartList">${invoiceParts.map((p,i)=>`<div class="card" style="padding:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center"><span>${esc(partName(p.partId))} × ${fa(p.qty)} — ${money(p.unitPrice*p.qty)}</span><button type="button" class="btn red" onclick="removeInvoicePart(${i})">حذف</button></div>`).join('')||'<span class="hint">هنوز قطعه‌ای انتخاب نشده است.</span>'}</div>`;form.elements.partsJson.value=JSON.stringify(invoiceParts)}
function addInvoicePart(){const pid=document.getElementById('invoicePartSelect')?.value,q=num(document.getElementById('invoicePartQty')?.value);const p=db.parts.find(x=>x.id===pid);if(!p||q<1)return toast('قطعه و تعداد را انتخاب کنید');const existing=invoiceParts.find(x=>x.partId===pid);const newQty=(existing?.qty||0)+q;if(newQty>num(p.qty))return toast('موجودی قطعه کافی نیست');if(existing)existing.qty=newQty;else invoiceParts.push({partId:pid,qty:q,unitPrice:num(p.sell)});renderInvoiceParts()}
function removeInvoicePart(i){invoiceParts.splice(i,1);renderInvoiceParts()}
function closeModal(){modal.classList.remove('show')}function edit(t,i){let table=t==='customer'?'customers':t==='job'?'jobs':t==='part'?'parts':null;let x=table?db[table].find(a=>a.id===i):null;if(x)openForm(t,x)}function addCar(cid){openForm('car');setTimeout(()=>form.elements.customerId.value=cid,20)}
async function submitForm(){let data=Object.fromEntries(new FormData(form).entries());if(formType==='job'&&data.photo instanceof File&&data.photo.size){data.photo=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(data.photo)})}else delete data.photo;if(formType==='job'&&!data.photo&&editing)data.photo=db.jobs.find(x=>x.id===editing)?.photo||'';let table={customer:'customers',car:'cars',job:'jobs',appointment:'appointments',part:'parts',invoice:'invoices'}[formType];['buy','sell','labor','partsCost','discount'].forEach(k=>{if(data[k]!==undefined)data[k]=num(data[k])});if(formType==='car'){const existing=db.cars.find(x=>x.id===editing);data.customerId=data.customerId||existing?.customerId;if(!data.customerId)return toast('ابتدا مشتری خودرو را انتخاب کنید')}if(formType==='job'){const car=db.cars.find(x=>x.id===data.carId);if(!car)return toast('خودرو / پلاک را انتخاب کنید');data.customerId=car.customerId;if(data.partsCost===undefined)data.partsCost=0}if(formType==='invoice'){data.parts=invoiceParts.map(x=>({...x,qty:num(x.qty),unitPrice:num(x.unitPrice)}));const previous=db.invoices.find(x=>x.id===editing);const oldParts=previous?.parts||[];const oldMap=Object.fromEntries(oldParts.map(x=>[x.partId,num(x.qty)]));const newMap=Object.fromEntries(data.parts.map(x=>[x.partId,num(x.qty)]));const all=new Set([...Object.keys(oldMap),...Object.keys(newMap)]);for(const pid of all){const diff=(newMap[pid]||0)-(oldMap[pid]||0);const part=db.parts.find(x=>x.id===pid);if(!part||num(part.qty)-diff<0)return toast(`موجودی قطعه «${partName(pid)}» کافی نیست`)}for(const pid of all){const diff=(newMap[pid]||0)-(oldMap[pid]||0);const part=db.parts.find(x=>x.id===pid);if(part)part.qty=num(part.qty)-diff}data.partsCost=data.parts.reduce((s,x)=>s+num(x.unitPrice)*num(x.qty),0);data.total=(+data.labor||0)+(+data.partsCost||0)-(+data.discount||0)}if(formType==='appointment'&&!data.date)data.date=today();let previous=null;if(editing){let i=db[table].findIndex(x=>x.id===editing);previous=db[table][i]?{...db[table][i]}:null;db[table][i]={...db[table][i],...data}}else{data.id=id();data.createdAt=Date.now();if(formType==='customer')db[table].unshift(data);else db[table].push(data)}save();closeModal();render();toast('اطلاعات ذخیره شد');if(formType==='job'){const customerId=data.customerId||previous?.customerId;const phone=phoneOf(customerId);const accepted=!previous&&(data.status==='پذیرش شده'||!data.status);const ready=!!previous&&previous.status!=='آماده تحویل'&&data.status==='آماده تحویل';if(accepted&&phone){setTimeout(()=>sms(customerId,'خودروی شما پذیرش شد\nبرق خودرو مهندس\n۰۹۱۸۹۱۶۲۹۳۹'),250)}if(ready&&phone){const labor=num(data.labor??previous.labor),parts=num(data.partsCost??previous.partsCost);const msg=`خودروی شما آماده تحویل است\nاجرت تعمیر: ${money(labor)}\nهزینه قطعه: ${money(parts)}\nجمع هزینه: ${money(labor+parts)}\nبرق خودرو مهندس\n۰۹۱۸۹۱۶۲۹۳۹`;setTimeout(()=>sms(customerId,msg),250)}}}
function del(t,i){if(confirm('این مورد حذف شود؟')){db[t]=db[t].filter(x=>x.id!==i);save();render()}}function sms(cid,msg){let p=phoneOf(cid);if(!p)return toast('شماره موبایل مشتری ثبت نشده است');if(confirm('متن پیامک آماده شود؟ پس از باز شدن برنامه پیامک، دکمه ارسال را بزنید.')){location.href='sms:'+encodeURIComponent(p)+'?body='+encodeURIComponent(msg)}}function invoiceFrom(jobId){let j=db.jobs.find(x=>x.id===jobId);if(!j)return;openForm('invoice');setTimeout(()=>{form.elements.customerId.value=j.customerId;form.elements.items.value=`خودرو: ${carLabel(j.carId)}\nشرح عیب: ${j.problem||''}\nاقدامات: ${j.work||''}`},30)}function printInvoice(i){let x=db.invoices.find(a=>a.id===i);printArea.innerHTML=`<div class="invoice"><h2>برق خودرو مهندس</h2><h3 style="text-align:center">فاکتور خدمات تعمیرگاهی</h3><p>شماره: ${esc(x.number)}　 تاریخ: ${esc(x.date)}　 مشتری: ${esc(customerName(x.customerId))}</p><p>شرح: ${esc(x.items).replace(/\n/g,'<br>')}</p><table><tr><th>اجرت</th><th>قطعات</th><th>تخفیف</th><th>جمع کل (تومان)</th></tr><tr><td>${money(x.labor)}</td><td>${money(x.partsCost)}</td><td>${money(x.discount)}</td><td>${money(x.total)}</td></tr></table><p style="margin-top:40px">امضا و مهر تعمیرگاه: __________________</p></div>`;printArea.classList.remove('hide');if(window.AndroidPrint){AndroidPrint.printPage()}else{window.print()}setTimeout(()=>printArea.classList.add('hide'),2500)}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bargh-khodro-mohandes-backup.json';a.click();URL.revokeObjectURL(a.href);toast('فایل پشتیبان آماده شد')}function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.jobs)throw 0;if(confirm('اطلاعات فعلی با نسخه پشتیبان جایگزین شود؟')){db=x;save();render();toast('بازیابی انجام شد')}}catch(_){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(file)}function exportCSV(){let rows=[['نام مشتری','موبایل','تعداد فاکتور'],...db.customers.map(c=>[c.name,c.phone,db.invoices.filter(i=>i.customerId===c.id).length])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='gozaresh-bargh-mohandes.csv';a.click()}
stats();render();
</script></body></html>
